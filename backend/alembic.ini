[alembic]
# 마이그레이션 스크립트가 위치할 디렉터리
script_location = alembic

# 파일명에 revision id/생성시각 등을 포함시켜 정렬/추적을 쉽게 한다
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url은 여기서 고정값으로 두지 않는다. 실제 값은 alembic/env.py가
# app.core.config.get_settings().database_url(=.env의 DATABASE_URL)에서 읽어와
# 런타임에 덮어쓴다 - .env와 alembic.ini 두 곳에 DB 접속정보가 따로 존재해 값이
# 어긋나는 것을 방지하기 위함이다 (요구사항: 설정은 .env로 단일화).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
